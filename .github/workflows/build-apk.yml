name: Build Debug APK

on:
  push:
    branches:
      - '**'
    paths:
      - 'IrPoc/**'
      - '.github/workflows/build-apk.yml'
  pull_request:
    paths:
      - 'IrPoc/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build:
    name: Assemble Debug APK
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: IrPoc

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required SDK packages
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0" || true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('IrPoc/**/*.gradle*', 'IrPoc/**/libs.versions.toml', 'IrPoc/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --no-daemon --console=plain --stacktrace

      - name: Rename APK with version info
        run: |
          mv app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/irpoc-${{ github.sha }}.apk

      - name: Upload debug APK (artifact)
        if: github.event_name != 'push' || github.ref_name != 'main'
        uses: actions/upload-artifact@v4
        with:
          name: irpoc-debug-apk
          path: IrPoc/app/build/outputs/apk/debug/irpoc-${{ github.sha }}.apk
          if-no-files-found: error
          retention-days: 14

      - name: Create Release (main branch only)
        if: github.event_name == 'push' && github.ref_name == 'main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "Build #${{ github.run_number }}"
          body: "自动构建 debug APK"
          files: IrPoc/app/build/outputs/apk/debug/irpoc-${{ github.sha }}.apk
          draft: false
          prerelease: true
          generate_release_notes: false
