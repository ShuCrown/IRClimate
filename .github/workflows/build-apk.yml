name: Build Debug APK

on:
  push:
    branches:
      - '**'
    paths:
      - 'IrPoc/**'
      - '.github/workflows/build-apk.yml'
  pull_request:
    paths:
      - 'IrPoc/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Assemble Debug APK
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: IrPoc

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required SDK packages
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0" || true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('IrPoc/**/*.gradle*', 'IrPoc/**/libs.versions.toml', 'IrPoc/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      # ── 仅 main 分支：读取版本号并递增 patch（+0.0.1）──
      - name: Bump version (main branch only)
        if: github.event_name == 'push' && github.ref_name == 'main'
        id: bump_version
        run: |
          VERSION_NAME=$(grep "VERSION_NAME=" version.properties | cut -d'=' -f2 | tr -d '[:space:]')
          VERSION_CODE=$(grep "VERSION_CODE=" version.properties | cut -d'=' -f2 | tr -d '[:space:]')

          echo "Current version: $VERSION_NAME (code $VERSION_CODE)"

          # 递增 patch 版本号 (例如 1.0.0 → 1.0.1)
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION_NAME"
          NEW_PATCH=$((PATCH + 1))
          NEW_VERSION_NAME="$MAJOR.$MINOR.$NEW_PATCH"
          NEW_VERSION_CODE=$((VERSION_CODE + 1))

          echo "New version: $NEW_VERSION_NAME (code $NEW_VERSION_CODE)"

          # 写回 version.properties
          printf "VERSION_CODE=%s\nVERSION_NAME=%s\n" "$NEW_VERSION_CODE" "$NEW_VERSION_NAME" > version.properties

          echo "version_name=$NEW_VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$NEW_VERSION_CODE" >> "$GITHUB_OUTPUT"

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --no-daemon --console=plain --stacktrace

      - name: Rename APK with version info
        run: |
          APK_VERSION="${{ steps.bump_version.outputs.version_name || github.sha }}"
          mv app/build/outputs/apk/debug/app-debug.apk "app/build/outputs/apk/debug/irpoc-v${APK_VERSION}.apk"

      - name: Upload debug APK (artifact)
        if: github.event_name != 'push' || github.ref_name != 'main'
        uses: actions/upload-artifact@v4
        with:
          name: irpoc-debug-apk
          path: IrPoc/app/build/outputs/apk/debug/irpoc-*.apk
          if-no-files-found: error
          retention-days: 14

      # ── 仅 main 分支：提交版本号变更（跳过 CI 避免循环触发）──
      - name: Commit version bump (main branch only)
        if: github.event_name == 'push' && github.ref_name == 'main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add version.properties
          git commit -m "chore: bump version to v${{ steps.bump_version.outputs.version_name }} [skip ci]"
          git push

      # ── 仅 main 分支：创建 GitHub Release ──
      - name: Create Release (main branch only)
        if: github.event_name == 'push' && github.ref_name == 'main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.bump_version.outputs.version_name }}
          name: "v${{ steps.bump_version.outputs.version_name }}"
          body: |
            ## Release v${{ steps.bump_version.outputs.version_name }}

            合并到 main 分支自动发布的 release 版本。
          files: IrPoc/app/build/outputs/apk/debug/irpoc-v${{ steps.bump_version.outputs.version_name }}.apk
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
